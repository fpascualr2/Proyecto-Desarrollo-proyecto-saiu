<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h2>SAIU</h2>
      <p>Sistema Académico Universitario</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="username">Usuario / Carnet</label>
        <input 
          id="username" 
          type="text" 
          formControlName="username" 
          placeholder="Ej. 202400123" 
          autocomplete="username"
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          id="password" 
          type="password" 
          formControlName="password" 
          placeholder="••••••••" 
          autocomplete="current-password"
        />
      </div>

      <div *ngIf="errorMessage" class="error-alert">
        {{ errorMessage }}
      </div>

      <button type="submit" [disabled]="loginForm.invalid || isLoading" class="btn-submit">
        <span *ngIf="!isLoading">Ingresar al Sistema</span>
        <span *ngIf="isLoading">Verificando acceso...</span>
      </button>
    </form>
  </div>
</div>
